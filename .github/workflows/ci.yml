name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (flake8 against the baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Keep this list in step with the `dev` extra in pyproject.toml and with
      # the flake8 hook in .pre-commit-config.yaml -- .flake8 selects "B" and
      # "C4", which only exist with these plugins installed, so a run without
      # them would silently check a smaller rule set and always pass.
      # tests/test_utils/test_lint_config_consistency.py is the guard.
      - name: Install flake8 and the plugins .flake8 selects
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 flake8-bugbear flake8-comprehensions

      - name: Compare against scripts/flake8_baseline.txt
        run: python scripts/check_flake8_baseline.py

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock pins the whole cpu+dev+test set; the project itself goes
          # in with --no-deps so editable installation cannot quietly resolve
          # anything newer than what the lock froze.
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      # The coverage table is printed, not enforced -- see the note in
      # pyproject.toml.  `--cov` is not in `addopts` so that a local
      # `pytest tests` stays the fast path.
      - name: Run tests with a coverage summary
        run: |
          set +e
          python -m pytest tests --cov=anylabeling --cov-report=term > pytest-out.txt 2>&1
          code=$?
          set -e
          tail -40 pytest-out.txt
          exit $code

      - name: Surface failures as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest-out.txt |
            sed "s/ - .*//" | sort -u | head -9 |
            while IFS= read -r line; do
              echo "::error::${line:0:350}"
            done

  # The README's OS badge says linux/win/mac; the test job above only runs
  # Windows.  These smoke runs make the other two claims checked instead of
  # decorative: same suite, same locked dependency set, Qt offscreen.
  smoke:
    name: Smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6's manylinux wheel loads these at runtime even on the offscreen
      # platform; the runner image does not ship all of them.
      - name: Install the system libraries PyQt6 needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Run tests
        run: |
          set +e
          python -m pytest tests -q --tb=no -rf > pytest-out.txt 2>&1
          code=$?
          set -e
          tail -40 pytest-out.txt
          exit $code

      # The log-download API needs admin rights, but job annotations are
      # public: a failing run leaves its failure list here so non-admin
      # sessions can debug a red smoke run without the web UI.  GitHub caps
      # annotations at 10 per step, so stay under that.
      - name: Surface failures as annotations
        if: failure()
        run: |
          # pytest -rf messages are multi-line (assertEqual diffs ride
          # along); keep only the test id per failure so 10 fit the cap.
          grep -E "^(FAILED|ERROR) " pytest-out.txt |
            sed "s/ - .*//" | sort -u | head -9 |
            while IFS= read -r line; do
              echo "::error::${line:0:350}"
            done
          if ! grep -qE "^(FAILED|ERROR) " pytest-out.txt; then
            grep -vE "^[0-9.]+s (call|setup|teardown)" pytest-out.txt |
              tail -8 | while IFS= read -r line; do
                echo "::error::${line:0:350}"
              done
          fi
