# pre-commit run --all-files
#
# Install once with:  pre-commit install
#
# This config is the local half of the lint gate; the other half is the `lint`
# job in .github/workflows/ci.yml.  Both run the same command against the same
# baseline, so a finding that is caught before a commit is also caught in CI.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=8096']
    -   id: check-case-conflict
    -   id: check-executables-have-shebangs
    -   id: check-merge-conflict
    -   id: check-shebang-scripts-are-executable
    -   id: check-symlinks
    -   id: check-yaml
    -   id: debug-statements
        exclude: tests/
    -   id: destroyed-symlinks
    -   id: end-of-file-fixer
        exclude: tests/test_changes/
        files: \.(py|sh|rst|yml|yaml)$
    -   id: mixed-line-ending
    -   id: trailing-whitespace
        files: \.(py|sh|rst|yml|yaml)$

# black was removed here once because `black --check` rejected 44 of the 156
# files it looked at, and turning it on piecemeal would have reformatted the
# tree as a side effect of unrelated commits.  The decision went the other
# way instead: one dedicated reformat commit brought the tree to black's
# style (42 files, the two files a parallel refactor batch had in flight
# excluded -- pre-commit will settle them when that batch lands), and the
# hook is back, exactly once, rewriting rather than --check.  The version is
# pinned to the same 26.5.1 as the `black` entry in the `dev` extra, because
# black's output style changes between releases and a moving formatter would
# churn the tree on every upgrade.
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black

-   repo: local
    hooks:
    # The whole-repo flake8 gate, identical to the CI job.  It has to be the
    # whole repo rather than the staged files: a per-file flake8 would fail on
    # the 260 inherited findings in scripts/flake8_baseline.txt and block
    # anyone from touching a file that is already on the list.
    -   id: flake8-baseline
        name: flake8 baseline (no new findings)
        entry: python scripts/check_flake8_baseline.py --quiet
        language: python
        # Same rule set as CI and the `dev` extra: .flake8 selects "B" and
        # "C4", which only exist with these plugins present.
        additional_dependencies:
            - flake8
            - flake8-bugbear
            - flake8-comprehensions
        pass_filenames: false
        always_run: true

-   repo: https://github.com/rstcheck/rstcheck
    rev: v6.1.2
    hooks:
    -   id: rstcheck
        args: [
            --report-level=warning,
        ]
-   repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
    -   id: codespell
        files: \.(py|sh|rst|yml|yaml)$
        args: [--ignore-words=.codespell-ignore]
        # Emitted by pyside6-rcc: a wall of binary resource data that trips
        # 141 spell checks on fragments such as "\x00\x0eRetry".  black and
        # flake8 skip it for the same reason.
        exclude: ^anylabeling/resources/resources\.py$
