# X-AnyLabeling GPLv3 License - https://github.com/CVHub520/X-AnyLabeling/blob/main/LICENSE

# Overview:
# This pyproject.toml file manages the build, packaging, and distribution of the X-AnyLabeling library.
# It defines essential project metadata, dependencies, and settings used to develop and deploy the library.

# Key Sections:
# - [build-system]: Specifies the build requirements and backend (e.g., setuptools, wheel).
# - [project]: Includes details like name, version, description, authors, dependencies and more.
# - [project.optional-dependencies]: Provides additional, optional packages for extended features.
# - [tool.*]: Configures settings for various tools (pytest, yapf, etc.) used in the project.

# Installation:
# The X-AnyLabeling library can be installed using the command: 'pip install "x-anylabeling-cvhub[xxx]"'
# For development purposes, you MUST specify a runtime environment (includes dev tools):
#   - CPU:       pip install -e ".[cpu,dev]"
#   - CUDA 12.x: pip install -e ".[gpu,dev]"
#   - CUDA 11.x: pip install -e ".[gpu-cu11,dev]"
#   - CUDA 13.x: pip install -e ".[gpu-cu13,dev]"
# Note: Ensure onnxruntime and onnxruntime-gpu are not installed simultaneously.
# This approach allows for real-time code modifications without the need for re-installation.

# Docs: https://github.com/CVHub520/X-AnyLabeling/tree/main/docs
# Examples: https://github.com/CVHub520/X-AnyLabeling/tree/main/examples/
# GitHub: https://github.com/CVHub520/X-AnyLabeling

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project settings -----------------------------------------------------------------------------------------------------
[project]
name = "jl-labeling-and-train"
dynamic = ["version"]
description = "Advanced Auto Labeling Solution with Added Features"
readme = "README.md"
requires-python = ">=3.11"
license = { "text" = "GPLv3" }
keywords = ["machine-learning", "deep-learning", "computer-vision", "multi-modal", "auto-labeling", "image-annotation", "AI", "LLM", "VLM", "YOLO", "SAM", "CLIP", "Grounding-DINO", "X-AnyLabeling"]
authors = [
    { name = "Wei Wang", email = "cv_hub@163.com" },
]
maintainers = [
    { name = "CVHub", email = "cvhub.cn@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Core dependencies
# Note: onnx and onnxruntime are in optional-dependencies for version compatibility
dependencies = [
    "natsort>=8.1.0",
    "pillow>=7.1.2",
    "pillow-heif>=0.18.0",
    "opencv-contrib-python-headless>=4.7.0.72",
    "PyQt6>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PyQt6>=6.6.0; sys_platform != 'linux'",
    "PyQt6-WebEngine>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.6.0; sys_platform != 'linux'",
    "qimage2ndarray>=1.10.0",
    "lapx>=0.5.5",
    "tqdm>=4.64.0",
    "scipy>=1.4.1",
    "PyYAML",
    "importlib_metadata",
    "json_repair",
    "jsonlines",
    "markdown",
    "openai",
    "socksio>=1.0.0",
    "psutil",
    "pyclipper",
    "six",
    "shapely",
    "termcolor",
    "tokenizers",
    "requests",
    "darkdetect>=0.8.0",
    "matplotlib",
    "python-lucide>=0.5.4",
]

# Optional dependencies ------------------------------------------------------------------------------------------------
[project.optional-dependencies]

dev = [
    "build",
    # Pinned exactly: black's output style changes between releases, and a
    # moving formatter would reformat the tree on every upgrade.  Keep in
    # step with the black hook rev in .pre-commit-config.yaml.
    "black==26.5.1",
    "flake8",
    # .flake8 selects "B" and "C4", which only exist with these two installed.
    # They must match the flake8 hook in .pre-commit-config.yaml and whatever
    # CI installs, or scripts/flake8_baseline.txt counts different rules.
    "flake8-bugbear",
    "flake8-comprehensions",
    "pyinstaller",
    "pytest",
    "pytest-cov",
    # PySide6 is deliberately NOT here: the i18n tools (pyside6-lrelease,
    # pyside6-rcc) live in a separate tool venv, and having PySide6 installed
    # next to PyQt6 makes `import onnxruntime` crash after PyQt6 has loaded
    # (the two Qt bindings' DLLs collide), which took down the win-cpu
    # release build.  See scripts/generate_languages.py for tool setup.
    "twine",
]

# CPU version: Latest ONNX + ONNXRuntime
cpu = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.15.0",
]
# What CI's test job and the release gate need beyond the runtime extras.
# Kept as an extra so the lock files can pin them like everything else.
# The locks (cpu+dev+test) are per platform -- a universal resolution would
# drag the Linux-only `PyQt6<6.10` cap onto Windows/macOS, where that PySide6-
# era bound is not wanted and onnxruntime 1.30 crashes under PyInstaller's
# isolated imports when PyQt6 6.9 is resident.  Regenerate all three with:
#   uv pip compile --python-platform windows --python-version 3.12 \
#       --extra cpu --extra dev --extra test -o requirements-lock-win.txt pyproject.toml
#   uv pip compile --python-platform linux  --python-version 3.12 \
#       --extra cpu --extra dev --extra test -o requirements-lock-linux.txt pyproject.toml
#   uv pip compile --python-platform macos  --python-version 3.12 \
#       --extra cpu --extra dev --extra test -o requirements-lock-macos.txt pyproject.toml
# CI and the release builds install the lock for their OS, so regenerate and
# commit whenever this file's dependencies change -- an unpinned `-e .`
# install would otherwise quietly drift from what the binaries were built with.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# CUDA 12.x: Latest ONNX + ONNXRuntime GPU (>= 1.18.1 for CUDA 12.x support)
gpu = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.18.1,<1.27.0; platform_system != 'Darwin'",
]
# CUDA 11.x: ONNX < 1.16.1 + ONNXRuntime GPU < 1.19
gpu-cu11 = [
    "numpy<2.0.0",
    "onnx>=1.15.0,<1.16.1",
    "onnxruntime-gpu>=1.15.0,<1.19.0; platform_system != 'Darwin'",
]
# CUDA 13.x: ONNXRuntime GPU >= 1.27
gpu-cu13 = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.27.0,<1.28.0; platform_system != 'Darwin'",
]

[project.urls]
"Source" = "https://github.com/CVHub520/X-AnyLabeling"
"Documentation" = "https://github.com/CVHub520/X-AnyLabeling/tree/main/docs"
"Bug Reports" = "https://github.com/CVHub520/X-AnyLabeling/issues"
"Changelog" = "https://github.com/CVHub520/X-AnyLabeling/releases"

[project.scripts]
jllabelingandtrain = "anylabeling.app:main"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "gpu-cu11" },
    ],
    [
        { extra = "gpu" },
        { extra = "gpu-cu11" },
    ],
    [
        { extra = "cpu" },
        { extra = "gpu-cu13" },
    ],
    [
        { extra = "gpu" },
        { extra = "gpu-cu13" },
    ],
    [
        { extra = "gpu-cu11" },
        { extra = "gpu-cu13" },
    ],
]

# Tools settings -------------------------------------------------------------------------------------------------------
[tool.setuptools]  # configuration specific to the `setuptools` build backend.
packages = { find = { where = ["."], include = ["anylabeling*"], exclude = ["resources*"] } }

[tool.setuptools.dynamic]
version = {attr = "anylabeling.app_info.__version__"}

[tool.pytest.ini_options]
addopts = "--doctest-modules --durations=30 --color=yes"
testpaths = ["tests"]
markers = [
    "slow: skip slow tests unless --slow is set",
]
norecursedirs = [".git", "dist", "build"]

# Coverage ratchet: `fail_under` locks the measured base and pytest-cov
# fails any `--cov` run that drops below it (the CI test job runs with
# --cov; a local bare `pytest tests` stays the fast path). Measured
# 2026-09-28 at 44.72% of 32088 statements -- the fork's own training
# dialog alone is 1741 statements at 12%, and Qt widget code is expensive
# to reach without driving real event loops, so the honest floor is what
# it is. Rule: when coverage grows, raise this number; never lower it.
[tool.coverage.run]
source = ["anylabeling"]
omit = [
    # Emitted by pyside6-rcc: a multi-megabyte byte literal, nothing to cover.
    "anylabeling/resources/resources.py",
]

[tool.coverage.report]
fail_under = 44
show_missing = true
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 79
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv(?:-[^/]+)?
  | _build
  | buck-out
  | build
  | dist
  | tests
)/
| ^/anylabeling/resources/resources\.py$
| _ui\.py$
'''
# The last alternative is the pyuic6 output (``*_ui.py``).  Those modules are
# generated from the matching .ui file and are git-ignored (.gitignore lists
# ``*_ui.py``), so CI never sees them -- but black does not read .gitignore,
# so without this a local ``black --check`` would fail on a freshly generated,
# never-formatted file.  Formatting generated code buys nothing either way,
# and the pattern is deliberately unanchored so it holds whichever form black
# hands to re.search.

# flake8 is configured in .flake8, not here.  flake8 only reads pyproject.toml
# through the third-party Flake8-pyproject plugin, so the [tool.flake8] table
# that used to sit here was dead config -- and being a second copy of the same
# ignore list, it was free to drift away from the one that actually applied.
